################################################################
# REDIS CONFIG - Homework Reference
# Network, Logging, Persistence, Memory Management, User Management
################################################################


################################################################
# 1. NETWORK SETTINGS
################################################################

# Alamat IP yang boleh mengakses Redis.
# 127.0.0.1 = hanya bisa diakses dari komputer/server itu sendiri (aman, default).
# Kalau butuh diakses dari server lain di jaringan, tambahkan IP server tersebut,
# dan WAJIB kombinasikan dengan password/ACL (jangan pernah bind 0.0.0.0 tanpa auth).
bind 127.0.0.1 -::1

# Port tempat Redis "mendengarkan" koneksi masuk. Default 6379.
port 6379

# Timeout koneksi idle (detik). 0 = tidak pernah timeout.
timeout 300

# Jumlah maksimal koneksi client yang diizinkan bersamaan.
maxclients 10000


################################################################
# 2. LOGGING
################################################################

# Lokasi file log. Kosongkan ("") untuk log ke stdout/terminal.
logfile "/var/log/redis/redis-server.log"

# Level detail log:
# warning = hanya pesan kritis
# notice  = info penting (disarankan untuk production)
# verbose = lebih banyak detail
# debug   = semua detail (untuk development/debugging)
loglevel notice


################################################################
# 3. PERSISTENCE (RDB vs AOF - kenapa pakai keduanya)
################################################################

# --- RDB (snapshot) ---
# Format: save <detik> <jumlah_perubahan_minimal>
# Simpan snapshot kalau minimal 1 perubahan dalam 900 detik, ATAU
# minimal 10 perubahan dalam 300 detik, ATAU minimal 10000 perubahan dalam 60 detik.
save 900 1
save 300 10
save 60 10000

# Nama file & lokasi hasil snapshot RDB.
dbfilename dump.rdb
dir /var/lib/redis

# --- AOF (Append Only File) ---
# Mencatat setiap command tulis (SET, DEL, dll) agar bisa di-replay saat restart.
appendonly yes
appendfilename "appendonly.aof"

# Seberapa sering AOF di-flush ke disk:
# always   = paling aman, tapi paling lambat (flush tiap command)
# everysec = kompromi terbaik (flush tiap 1 detik) <- paling umum dipakai
# no       = serahkan ke OS kapan flush (paling cepat, paling berisiko)
appendfsync everysec

# Kenapa RDB + AOF dipakai bersamaan:
# - RDB: snapshot ringkas, cepat untuk backup & disaster recovery, tapi bisa
#   kehilangan data di antara 2 snapshot kalau crash.
# - AOF: lebih aman/durable karena mencatat tiap perubahan, tapi file lebih besar
#   dan restore lebih lambat.
# Kombinasi keduanya = backup efisien (RDB) + minim kehilangan data (AOF).
# Saat restart dengan appendonly=yes, Redis akan restore dari AOF (lebih lengkap).


################################################################
# 4. MEMORY MANAGEMENT
################################################################

# Batas maksimal RAM yang boleh dipakai Redis sebelum eviction policy jalan.
maxmemory 256mb

# Strategi penghapusan data saat memori penuh:
#
# volatile-*  -> hanya hapus key yang PUNYA TTL/expiry
# allkeys-*   -> boleh hapus key APAPUN (dengan atau tanpa TTL)
# noeviction  -> tidak hapus apapun, command tulis baru akan ERROR saat penuh
#
# Algoritma pemilihan key mana yang dihapus:
# lru    -> Least Recently Used  (hapus yang paling lama TIDAK diakses)
# lfu    -> Least Frequently Used (hapus yang paling JARANG diakses)
# random -> hapus secara acak (paling cepat, tidak pintar)
#
# Contoh kombinasi yang umum dipakai di production:
maxmemory-policy allkeys-lru

# Alternatif lain yang sering dipakai (pilih salah satu sesuai use-case):
# maxmemory-policy volatile-lru   # hanya key ber-TTL, prioritas yang jarang diakses
# maxmemory-policy allkeys-lfu    # key apapun, prioritas berdasar frekuensi akses
# maxmemory-policy noeviction     # untuk use-case yang tidak boleh kehilangan data sama sekali


################################################################
# 5. USER MANAGEMENT (ACL & AUTH)
################################################################

# --- Cara lama: single password untuk semua client ---
# requirepass mypassword123
# Client connect dengan: AUTH mypassword123
# (Kelemahan: tidak ada pembedaan hak akses antar user/aplikasi)

# --- Cara modern (Redis 6+): ACL, multi-user dengan hak akses berbeda ---

# User default (wajib ada), bisa dinonaktifkan demi keamanan kalau semua akses
# sudah dialihkan ke user ACL khusus:
user default on nopass sanitize-payload ~* &* +@all

# Contoh membuat user baru bernama "appuser":
# user <nama>   on/off   >password   ~<pattern key>   +<command yang diizinkan>   -<command yang dilarang>
user appuser on >mypassword456 ~app:* +get +set -flushall -flushdb

# Penjelasan tiap bagian:
# appuser        -> nama user
# on             -> user aktif (pakai "off" untuk nonaktifkan)
# >mypassword456 -> set password (">" artinya assign password ini)
# ~app:*         -> hanya boleh akses key yang diawali "app:"
# +get +set      -> diizinkan pakai command GET dan SET
# -flushall      -> dilarang pakai FLUSHALL (hapus semua data)
# -flushdb       -> dilarang pakai FLUSHDB (hapus seluruh database aktif)

# Perintah ACL lain yang berguna (dijalankan lewat redis-cli, bukan di file config):
# ACL SETUSER appuser on >mypassword456 ~app:* +get +set -flushall
# ACL LIST       -> lihat semua user yang terdaftar
# ACL WHOAMI     -> cek user yang sedang login saat ini
# ACL DELUSER appuser -> hapus user

# Kenapa ACL penting:
# Prinsip "least privilege" - setiap aplikasi/user cukup diberi akses yang
# benar-benar dia butuhkan, bukan akses penuh (super admin) ke semua data.